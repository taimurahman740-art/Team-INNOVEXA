# INNOVEXA full local development stack.
# From repository root: docker compose -f Campus-maintenance/docker-compose.yml up --build
name: campus-maintenance
services:
  db:
    image: postgres:16
    container_name: campus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-campus_maintenance}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql:ro
      - ../database/api_compatibility.sql:/docker-entrypoint-initdb.d/3_api_compatibility.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [campus_net]
  backend:
    build:
      context: ../backend
    container_name: campus_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-campus_maintenance}
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-secret-change-before-deployment}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
    networks: [campus_net]
  frontend:
    build:
      context: ../frontend
    container_name: campus_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [campus_net]
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: campus_pgadmin
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports: ["5050:80"]
    depends_on:
      db:
        condition: service_healthy
    networks: [campus_net]
volumes:
  pgdata:
  uploads:
networks:
  campus_net:
