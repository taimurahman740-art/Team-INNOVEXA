services:
  - type: web
    name: innovexa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Production database is Neon PostgreSQL. The connection string is set in the
      # Render dashboard and must not be synced from the old Render database below.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: "*"

  - type: web
    name: innovexa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: innovexa-api
          property: host

# Old Render PostgreSQL. Kept, untouched, until the Neon setup and a backup restore
# are verified. Do not delete it and do not point DATABASE_URL back at it.
databases:
  - name: innovexa-db
    plan: free
    databaseName: innovexa
    user: innovexa_user
