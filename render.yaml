services:
  - type: web
    name: innovexa-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: innovexa-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: "*"

  - type: web
    name: innovexa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: innovexa-api
          property: host

databases:
  - name: innovexa-db
    plan: free
    databaseName: innovexa
    user: innovexa_user
